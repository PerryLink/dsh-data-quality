<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">dsh-data-quality: one read-only dataset, three deterministic instruments, one keyed report ledger</title>
<desc id="flowDesc">A workspace-confined dataset file is read-only and re-loaded per run under maxRows / maxFileSizeMB / allowedExtensions guards; the same input fans out to the profile, clean, and verify instruments (clean additionally writes the clean-diff profile delta and hands its output table to verify); all runs fan into one data_quality report ledger keyed by the deterministic reportKey, and a read-back wire returns from the ledger to the dataset for verifyCitations statuses.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#f9f6fd"/>
    <stop offset="1" stop-color="#e4eaf8"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1b1735" flood-opacity="0.10"/>
  </filter>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.4" fill="#d9d3ea"/>
  </pattern>
</defs>
<rect width="1100" height="660" fill="url(#bg)"/>
<rect width="1100" height="660" fill="url(#dots)" opacity=".4"/>
